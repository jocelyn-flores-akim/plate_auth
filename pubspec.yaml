name: chu_hospital_app
description: Application de digitalisation hospitalière CHU Togo.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase & State Management
  supabase_flutter: ^1.10.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # UI & Responsive
  responsive_builder: ^0.7.0
  flutter_screenutil: ^5.9.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  loading_animation_widget: ^1.2.1
  
  # State Persistence
  shared_preferences: ^2.2.0
  
  # Networking & HTTP
  dio: ^5.3.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0
  
  # Date & Time
  table_calendar: ^3.0.9
  
  # Forms & Validation
  form_builder_validators: ^9.1.0
  flutter_form_builder: ^9.1.0
  
  # PDF Export
  pdf: ^3.10.0
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
